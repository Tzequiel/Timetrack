spring.application.name=maintenance
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:5506/db_maintenance?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=rootpassword123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.file.name=logs/app-dev.json
logging.structured.format.file=logstash
logging.structured.format.console=logstash