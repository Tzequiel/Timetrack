server: 
  port: 8090
spring:
  application:
    name: gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: attendance
            uri: http://localhost:8080
            predicates: 
              - Path=/api/attendance/**
          - id: auth
            uri: http://localhost:8081
            predicates: 
              - Path=/api/auth/**
          - id: biometric
            uri: http://localhost:8082
            predicates: 
              - Path=/api/biometrics/**
          - id: location
            uri: http://localhost:8085
            predicates: 
              - Path=/api/location/**
          - id: maintenance
            uri: http://localhost:8083
            predicates: 
              - Path=/api/audit/**
          - id: manag
            uri: http://localhost:8084
            predicates: 
              - Path=/api/users/**
          - id: metrics
            uri: http://localhost:8086
            predicates: 
              - Path=/api/reports/**
          - id: notif
            uri: http://localhost:8087
            predicates: 
              - Path=/api/notifications/**
          - id: schedule
            uri: http://localhost:8088
            predicates: 
              - Path=/api/schedules/**
          - id: sucursales
            uri: http://localhost:8089
            predicates: 
              - Path=/api/branches/**